name: Standalone smoke checks

on:
  push:
    branches:
      - portable/standalone
  workflow_dispatch:

jobs:
  portable-smoke:
    name: Python smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile portable Python sources and installer
        run: python -m compileall -q scripts/copper.py scripts/create-data-manifest.py scripts/organize-inference-results.py scripts/install/bootstrap.py infer_topk.py tests/test_portable_workflow.py tests/test_installer.py
      - name: Run dependency-free portability tests
        run: python -m unittest discover -s tests -p test_portable_workflow.py -v
      - name: Run offline installer policy tests
        run: python -m unittest discover -s tests -p test_installer.py -v
      - name: Bash installer syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh
      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
